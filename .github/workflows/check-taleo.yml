name: Check NATO Taleo jobs

on:
  schedule:
    # Déclenché toutes les heures (UTC 6h-19h). L'étape "Garde horaire" ne laisse
    # passer qu'un run toutes les ~3 h, entre 8h et 20h heure de Belgique, rien la nuit.
    # Robuste aux retards de GitHub et à l'heure d'été/hiver.
    - cron: "7 6-19 * * *"
    # Résumé hebdomadaire (lundi matin)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-taleo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Garde horaire (heure de Belgique)
        id: gate
        run: |
          H=$(TZ=Europe/Brussels date +%H)
          H=$((10#$H))
          RUN=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "0 6 * * 1" ]; then
            AGE=$(python3 - <<'PY'
          import json, time
          from datetime import datetime
          try:
              g = json.load(open("docs/jobs.json"))["generated_at"]
              print(int(time.time() - datetime.fromisoformat(g).timestamp()))
          except Exception:
              print(999999)
          PY
          )
            echo "Heure Belgique : ${H}h — dernier run il y a ${AGE}s"
            if [ "$H" -lt 8 ] || [ "$H" -gt 20 ]; then RUN=false; fi
            if [ "$AGE" -lt 9000 ]; then RUN=false; fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "Exécution : $RUN"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        if: steps.gate.outputs.run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEEKLY_SUMMARY: ${{ github.event.schedule == '0 6 * * 1' && '1' || '' }}
        run: python taleo_monitor.py

      - name: Commit state and data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json debug_page.txt debug_page.html docs/jobs.json docs/history.json docs/history_stats.json 2>/dev/null || true
          git add debug_detail_page.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien à committer"
          else
            git commit -m "Mise à jour des offres"
            git pull --no-rebase -X ours --no-edit origin main
            git push
          fi
