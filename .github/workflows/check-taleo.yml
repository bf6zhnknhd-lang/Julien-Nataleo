name: Check NATO Taleo jobs

permissions:
  contents: write

on:
  schedule:
    # Horaires en UTC. Heure d'été belge (UTC+2, actuellement) : 7h/11h/15h
    # UTC = 9h/13h/17h locale. À l'heure d'hiver (UTC+1, dès fin octobre),
    # repasser cette ligne à "0 8,12,16 * * 1-5" pour garder 9h/13h/17h local.
    - cron: "0 7,11,15 * * 1-5"
  workflow_dispatch: {}  # permet de lancer manuellement depuis l'onglet Actions

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python taleo_monitor.py

      - name: Commit updated state
        run: |
          git config user.name "taleo-bot"
          git config user.email "actions@github.com"
          git add state.json debug_page.txt debug_page.html docs/jobs.json
          [ -f debug_detail_page.txt ] && git add debug_detail_page.txt || true
          git diff --quiet --cached || git commit -m "Update job state"
          git push

